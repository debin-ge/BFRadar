[project]
name = "bfradar"
version = "0.1.0"
description = "黑五雷达（BFRadar / BlackFridayRadar）：黑五 VPS 优惠聚合站"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11,<4",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fonttools>=4.68.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
